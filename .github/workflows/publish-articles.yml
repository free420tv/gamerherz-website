name: Publish GAMERHERZ articles
on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'media/**'
      - 'scripts/build-articles.mjs'
      - '.github/workflows/publish-articles.yml'
  workflow_dispatch:

concurrency:
  group: gamerherz-article-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout article sources (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout website production branch
        uses: actions/checkout@v4
        with:
          ref: gamerherz-v3-entwurf
          path: source/site
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish with safe retries
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publishing attempt $attempt"
            git -C site fetch origin gamerherz-v3-entwurf
            git -C site reset --hard FETCH_HEAD

            mkdir -p site/media
            if [ -d media ]; then cp -a media/. site/media/; fi

            node scripts/build-articles.mjs
            git -C site add beitraege sitemap.xml media

            if git -C site diff --staged --quiet; then
              echo "All generated content is already published."
              exit 0
            fi

            git -C site commit -m "Publish updated GAMERHERZ articles"

            if git -C site push origin HEAD:gamerherz-v3-entwurf; then
              echo "Published successfully."
              exit 0
            fi

            echo "Production branch changed during publish; rebuilding from its latest state."
          done

          echo "::error::Unable to publish after five attempts."
          exit 1
