<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMERHERZ | Artikel & News</title>
<style>:root{color-scheme:dark;--cyan:#20c9ff;--muted:#9cacc3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#123b6955,transparent 38%),#080d19;color:#f3f8ff;font:16px/1.7 system-ui,Arial,sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;background:#080d19ec;border-bottom:1px solid #26364b;z-index:2}.nav{max-width:1150px;margin:auto;padding:17px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--cyan)}.back,.read{color:#72d4ff}main{max-width:1150px;margin:auto;padding:48px 24px 75px}.eyebrow,.tag{font-size:12px;color:#69d7ff;letter-spacing:1px;font-weight:800;text-transform:uppercase}h1{font-size:clamp(32px,5vw,54px);line-height:1.2;margin:12px 0}.sub{color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}.filters button{cursor:pointer;color:#d8e8f8;border:1px solid #345272;border-radius:99px;padding:9px 15px;background:#112138;font:inherit}.filters button:hover,.filters button[aria-pressed="true"]{background:#126ba2;border-color:var(--cyan);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:linear-gradient(150deg,#17243a,#101827);border:1px solid #2a3d56;border-radius:18px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:var(--cyan)}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:1px solid #2a3d56}.postcover{width:100%;max-height:420px;object-fit:cover;border-radius:13px;margin:18px 0}.card a{display:block;padding:26px;height:100%}.card h2{font-size:22px;line-height:1.3}.card p{color:var(--muted)}.date{font-size:13px;color:#a1b1c7}.read{font-weight:800}.post{max-width:840px;margin:24px auto;padding:clamp(22px,5vw,52px);background:#111b2c;border:1px solid #2c4460;border-radius:20px}.post h1{font-size:clamp(29px,4vw,46px)}.post h2,.post h3{color:#a9deff}.post a{color:#70d1ff;text-decoration:underline}.post img{max-width:100%;height:auto}.post li{padding:3px 0}.post blockquote{border-left:3px solid var(--cyan);padding-left:18px;margin-left:0}.affiliate{margin-top:30px;padding:20px;border:1px solid #356284;border-radius:14px;background:#0b263a}.affiliate p{font-size:13px;color:#cad9e6}.amazonbtn{display:inline-block;padding:12px 20px;background:linear-gradient(110deg,#12b8f5,#4e78ff);border-radius:10px;color:#03111f!important;font-weight:800;text-decoration:none!important}.amazonbtn:hover{filter:brightness(1.12)}.error{color:#ffc3c3}footer{text-align:center;padding:28px;border-top:1px solid #26364b;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.brand{font-size:20px}main{padding:30px 18px}.post{padding:22px 18px}}</style></head>
<body><header><nav class="nav"><a class="brand" href="/">GAMER<span>HERZ</span></a><a class="back" href="/">← Startseite</a></nav></header><main><div id="page">Artikel werden geladen …</div></main><footer>GAMERHERZ · Technik mit Leidenschaft · <a href="/kontakt.html">Kontakt</a> · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a> · <a href="/affiliate-hinweis.html">Affiliate-Hinweis</a></footer>
<script>
const path='https://raw.githubusercontent.com/free420tv/gamerherz-website/main/content/articles/';
const api='https://api.github.com/repos/free420tv/gamerherz-website/contents/content/articles?ref=main';
const cats=['Alle','Gaming','Hardware','PC-Optimierung','Kaufberatung','News'];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(source,name){const match=source.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n/);const meta={};if(match){for(const line of match[1].split(/\r?\n/)){const m=line.match(/^([\w-]+):\s*(.*)$/);if(m)meta[m[1]]=m[2].trim().replace(/^["']|["']$/g,'');}}return {meta,name,body:source.slice(match?match[0].length:0)};}
function img(a){const p=a.meta.image;if(!p)return '';if(/^https:\/\//.test(p))return p;if(p.startsWith('/media/'))return 'https://raw.githubusercontent.com/free420tv/gamerherz-website/main'+p;return '';}
function cat(a){return cats.includes(a.meta.category)?a.meta.category:'Gaming';}
function short(a){return a.meta.summary||a.body.replace(/[#*_>\[\]()]/g,'').trim().slice(0,155)+'…';}
function date(a){const d=a.meta.date||a.name.slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(d)?new Date(d+'T12:00:00').toLocaleDateString('de-AT',{year:'numeric',month:'long',day:'2-digit'}):d;}
function inline(t){return escapeHTML(t).replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,(_,alt,url)=>'<img alt="'+alt+'" src="'+url+'" loading="lazy">').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" rel="noopener noreferrer">'+label+'</a>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');}
function markdown(body){const output=[];let list='';const close=()=>{if(list){output.push('</'+list+'>');list='';}};for(const line of body.split(/\r?\n/)){const s=line.trim();if(!s){close();continue;}const ordered=/^\d+\.\s/.test(s),unordered=/^[-*]\s/.test(s);if(ordered||unordered){const type=ordered?'ol':'ul';if(list!==type){close();output.push('<'+type+'>');list=type;}output.push('<li>'+inline(s.replace(ordered?/^\d+\.\s/:/^[-*]\s/,''))+'</li>');continue;}close();const h=s.match(/^(#{1,4})\s+(.+)$/);if(h){const n=h[1].length;output.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');}else if(s.startsWith('> ')){output.push('<blockquote>'+inline(s.slice(2))+'</blockquote>');}else output.push('<p>'+inline(s)+'</p>');}close();return output.join('');}
function viewList(items){document.title='Artikel & News | GAMERHERZ';document.getElementById('page').innerHTML='<div class="eyebrow">GAMING / HARDWARE / LEIDENSCHAFT</div><h1>Artikel & News</h1><p class="sub">Tests, PC-Tipps und ehrliche Kaufberatung.</p><div class="filters" id="filters"></div><div class="grid" id="cards"></div>';const buttons=document.getElementById('filters'),cards=document.getElementById('cards');const render=c=>{cards.innerHTML=items.filter(a=>c==='Alle'||cat(a)===c).map(a=>'<article class="card"><a href="?artikel='+encodeURIComponent(a.name)+'">'+(img(a)?'<img class="cover" src="'+escapeHTML(img(a))+'" alt="" loading="lazy">':'')+'<span class="tag">'+escapeHTML(cat(a))+'</span><h2>'+escapeHTML(a.meta.title||a.name)+'</h2><div class="date">'+escapeHTML(date(a))+'</div><p>'+escapeHTML(short(a))+'</p><span class="read">Artikel lesen →</span></a></article>').join('')||'<p>Hier sind noch keine Artikel vorhanden.</p>';buttons.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===c)));};for(const c of cats){const b=document.createElement('button');b.textContent=c;b.type='button';b.onclick=()=>render(c);buttons.appendChild(b);}render('Alle');}
function amazonLink(a){const value=(a.meta.amazon_link||'').trim();if(!value)return '';try{const u=new URL(value);const host=u.hostname.toLowerCase();if(u.protocol!=='https:'||!(host==='link.amazon'||host==='amzn.to'||host==='amazon.de'||host==='www.amazon.de'||host==='amazon.com'||host==='www.amazon.com'||host==='amazon.co.uk'||host==='www.amazon.co.uk'))return '';return '<aside class="affiliate"><p><strong>Werbung · Amazon-Partnerlink</strong></p><p>Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.</p><a class="amazonbtn" href="'+escapeHTML(u.href)+'" target="_blank" rel="sponsored nofollow noopener noreferrer">Bei Amazon ansehen ↗</a></aside>';}catch(e){return '';}}
function viewArticle(a){document.title=(a.meta.title||'Artikel')+' | GAMERHERZ';document.getElementById('page').innerHTML='<a class="back" href="/artikel.html">← Alle Artikel</a><article class="post"><div class="tag">'+escapeHTML(cat(a))+'</div><div class="date">'+escapeHTML(date(a))+'</div><h1>'+escapeHTML(a.meta.title||a.name)+'</h1><p class="sub">'+escapeHTML(short(a))+'</p>'+(img(a)?'<img class="postcover" src="'+escapeHTML(img(a))+'" alt="Beitragsbild">':'')+markdown(a.body)+amazonLink(a)+'</article>';}
async function start(){try{const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error(response.status);const entries=(await response.json()).filter(f=>f.type==='file'&&f.name.endsWith('.md'));const items=await Promise.all(entries.map(async f=>{const r=await fetch(path+encodeURIComponent(f.name));if(!r.ok)throw Error(f.name);return parse(await r.text(),f.name);}));items.sort((a,b)=>(b.meta.date||b.name).localeCompare(a.meta.date||a.name));const name=new URLSearchParams(location.search).get('artikel');if(!name)return viewList(items);const selected=items.find(a=>a.name===name);if(selected)viewArticle(selected);else document.getElementById('page').innerHTML='<p>Artikel nicht gefunden.</p><a href="/artikel.html">Zurück zur Übersicht</a>';}catch(err){console.error(err);document.getElementById('page').innerHTML='<p class="error">Artikel konnten gerade nicht geladen werden. Bitte später erneut versuchen.</p>';}}
start();
</script></body></html>
